name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      APP_NAME: FoldCraftLauncher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Restore app icon
        run: base64 --decode -i Support/AppIcon.base64 -o Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$APP_NAME-unsigned.ipa" Payload
          ls -lh "$APP_NAME-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error

      - name: Collect errors
        if: failure()
        run: |
          {
            echo "=== Errors ==="
            if [ -f build.log ]; then
              grep -E "error:|fatal error|\*\* BUILD FAILED \*\*|The following build commands failed" -A 3 build.log || true
              echo
              echo "=== Last 200 lines of build log ==="
              tail -n 200 build.log
            else
              echo "Build log not found. The failure happened before the build step."
            fi
          } > error.txt
          cat error.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-error-log
          path: error.txt

  engine:
    runs-on: macos-latest
    env:
      APP_NAME: FoldCraftLauncher
      ENGINE_REPOSITORY: https://github.com/AngelAuraMC/Amethyst-iOS.git
      ENGINE_COMMIT: f98c4133c72d39e06ceac42b57cc4477c52105fc
      BUNDLE_IDENTIFIER: com.nxteam.foldcraftlauncher.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout engine
        run: |
          git clone "$ENGINE_REPOSITORY" amethyst_engine
          cd amethyst_engine
          git checkout "$ENGINE_COMMIT"
          git submodule update --init --recursive

      - name: Patch engine
        run: python3 Engine/patch_engine.py amethyst_engine

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Install tools
        run: brew install ldid make

      - name: Build engine
        run: |
          set -o pipefail
          cd amethyst_engine
          gmake -j"$(sysctl -n hw.ncpu)" payload RELEASE=1 BOOTJDK="$JAVA_HOME/bin" 2>&1 | tee ../engine.log

      - name: Build modern LWJGL runtime
        run: |
          set -o pipefail
          ./Engine/build_modern_runtime.sh amethyst_engine/artifacts/Payload/AngelAuraAmethyst.app 2>&1 | tee -a engine.log

      - name: Brand and package
        run: |
          APP_PATH="amethyst_engine/artifacts/Payload/AngelAuraAmethyst.app"
          test -d "$APP_PATH"
          plutil -replace CFBundleIdentifier -string "$BUNDLE_IDENTIFIER" "$APP_PATH/Info.plist"
          plutil -replace CFBundleDisplayName -string "FCL" "$APP_PATH/Info.plist"
          plutil -replace CFBundleName -string "FCL" "$APP_PATH/Info.plist"
          ldid -S"amethyst_engine/entitlements.sideload.xml" "$APP_PATH/AngelAuraAmethyst"
          cd amethyst_engine/artifacts
          zip -qry --symlinks "../../$APP_NAME-engine-unsigned.ipa" Payload
          cd ../..
          ls -lh "$APP_NAME-engine-unsigned.ipa"

      - name: Upload engine IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-engine-unsigned-ipa
          path: ${{ env.APP_NAME }}-engine-unsigned.ipa
          if-no-files-found: error

      - name: Collect errors
        if: failure()
        run: |
          {
            echo "=== Errors ==="
            if [ -f engine.log ]; then
              grep -nE "error:|Error |\*\*\* |fatal" engine.log | head -100 || true
              echo
              echo "=== Last 200 lines of engine log ==="
              tail -n 200 engine.log
            else
              echo "Engine log not found. The failure happened before the build step."
            fi
          } > error.txt
          cat error.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-engine-error-log
          path: error.txt
