name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      APP_NAME: FoldCraftLauncher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Restore app icon
        run: base64 --decode -i Support/AppIcon.base64 -o Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$APP_NAME-unsigned.ipa" Payload
          ls -lh "$APP_NAME-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error

      - name: Collect errors
        if: failure()
        run: |
          {
            echo "=== Errors ==="
            if [ -f build.log ]; then
              grep -E "error:|fatal error|\*\* BUILD FAILED \*\*|The following build commands failed" -A 3 build.log || true
              echo
              echo "=== Last 200 lines of build log ==="
              tail -n 200 build.log
            else
              echo "Build log not found. The failure happened before the build step."
            fi
          } > error.txt
          cat error.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-error-log
          path: error.txt
